<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Among Us</title>
  <link rel="shortcut icon" href="favicon_2.ico">
  <style>
    .webgl-content * { border: 0; margin: 0; padding: 0; }
    .webgl-content { position: absolute; top: 50%; left: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }

    .webgl-content .logo, .progress { position: absolute; left: 50%; top: 50%; -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
    .webgl-content .logo { background: url('progressLogo.Dark_2.png') no-repeat center / contain; width: 154px; height: 130px; }
    .webgl-content .progress { height: 18px; width: 141px; margin-top: 90px; }
    .webgl-content .progress .empty { background: url('progressEmpty.Dark_2.png') no-repeat right / cover; float: right; width: 100%; height: 100%; display: inline-block; }
    .webgl-content .progress .full { background: url('progressFull.Dark_2.png') no-repeat left / cover; float: left; width: 0%; height: 100%; display: inline-block; }

    .webgl-content .logo.Dark { background-image: url('progressLogo.Dark_2.png'); }
    .webgl-content .progress.Dark .empty { background-image: url('progressEmpty.Dark_2.png'); }
    .webgl-content .progress.Dark .full { background-image: url('progressFull.Dark_2.png'); }

    .webgl-content .footer { margin-top: 5px; height: 38px; line-height: 38px; font-family: Helvetica, Verdana, Arial, sans-serif; font-size: 18px; color: #fff; }
    .webgl-content .footer .webgl-logo, .title, .fullscreen { height: 100%; display: inline-block; background: transparent center no-repeat; }
    .webgl-content .footer .title { margin-right: 10px; float: right; }
    .webgl-content .footer .fullscreen { background-image: url('data:image/svg+xml;utf8,<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="38" height="38" viewBox="0 0 24 24" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'); width: 38px; float: right; cursor: pointer; }
    
    body { background-color: #111; overflow: hidden; margin: 0; padding: 0; }
  </style>

  <script>
    function UnityProgress(gameInstance, progress) {
      if (!gameInstance.Module) return;

      if (!gameInstance.logo) {
        gameInstance.logo = document.createElement("div");
        gameInstance.logo.className = "logo " + (gameInstance.Module.splashScreenStyle || "Dark");
        gameInstance.container.appendChild(gameInstance.logo);
      }
      if (!gameInstance.progress) {    
        gameInstance.progress = document.createElement("div");
        gameInstance.progress.className = "progress " + (gameInstance.Module.splashScreenStyle || "Dark");
        gameInstance.progress.empty = document.createElement("div");
        gameInstance.progress.empty.className = "empty";
        gameInstance.progress.appendChild(gameInstance.progress.empty);
        gameInstance.progress.full = document.createElement("div");
        gameInstance.progress.full.className = "full";
        gameInstance.progress.appendChild(gameInstance.progress.full);
        gameInstance.container.appendChild(gameInstance.progress);
      }

      const percent = Math.round(100 * progress);
      gameInstance.progress.full.style.width = percent + "%";
      gameInstance.progress.empty.style.width = (100 - percent) + "%";

      if (progress === 1) {
        gameInstance.logo.style.display = gameInstance.progress.style.display = "none";
      }
    }
  </script>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer" style="width: 960px; height: 600px"></div>
    <div class="footer">
      <div class="title">Among Us</div>
      <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
    </div>
  </div>
</body>
</html>
